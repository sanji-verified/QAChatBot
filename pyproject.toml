[project]
name = "qachatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sanji-verified", email = "uttamsubhashteotia@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
qachatbot = "qachatbot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
